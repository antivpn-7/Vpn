Name: Sync 1 Source with Random Flags & Numbering

on:
  schedule:
    - cron: "0 */1 * * *" 
  workflow_dispatch:

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Fetch, Check and Style Keys
        run: |
          # 1. Твой источник
          SOURCE_URL="https://vpn.tgflovv.ru:8443/free-speed/3e6ec68a-567b-47cf-95e9-d0e925a935b5"
          FLAGS=("🇸🇴" "🇸🇴" "🇸🇴" "🇺🇸" "🇩🇪" "🇫🇮" "🇵🇱" "🇳🇱" "🇬🇧" "🇫🇷" "🇰🇿" "🇹🇷" "🇸🇪" "🇦🇹" "🇨🇿")

          touch README.md
          # 2. Отделяем свои ключи от тех, что создает скрипт
          grep "://" README.md | grep -v "Обход Блокировок" > my_own_keys.txt || touch my_own_keys.txt
          cut -d'#' -f1 my_own_keys.txt > existing_urls.txt

          # 3. Качаем и чистим Base64 (убираем любые пробелы перед декодированием)
          curl -L -k -s "$SOURCE_URL" -o raw.txt
          cat raw.txt | tr -d '[:space:]' > clean_base64.txt
          
          if ! grep -q "://" clean_base64.txt; then
            base64 -d clean_base64.txt > decoded_keys.txt 2>/dev/null || cp raw.txt decoded_keys.txt
          else
            cp raw.txt decoded_keys.txt
          fi

          # 4. Вытаскиваем только ссылки
          > alive_keys.txt
          COUNT=1
          
          # Используем grep -oE чтобы вытащить ссылки, даже если они в куче
          grep -oE "(vless|vmess|trojan|ss)://[^# ]+" decoded_keys.txt | while read -r CLEAN_URL; do
            if ! grep -Fxq "$CLEAN_URL" existing_urls.txt; then
              RANDOM_FLAG=${FLAGS[$RANDOM % ${#FLAGS[@]}]}
              echo "${CLEAN_URL}#${RANDOM_FLAG} Обход Блокировок 🔗 №$COUNT" >> alive_keys.txt
              COUNT=$((COUNT + 1))
            fi
          done

          # 5. Сборка README (the energy vpn)
          TRAFFIC_LINE=$(grep "#subscription-userinfo" README.md || echo "#subscription-userinfo: upload=0; download=0; total=1125899906842624; expire=3803572800")
          echo "$TRAFFIC_LINE" > new_readme.md
          echo "#profile-title: the energy vpn" >> new_readme.md
          echo "#announce:Если VPN не работает нажмите 🔄 , после ⏱️ и выберите сервер с наименьшим показателем ms!" >> new_readme.md
          echo "happ://routing/bypass-lan-and-cn?name=Bypass+LAN+and+CN" >> new_readme.md
          echo "" >> new_readme.md
          
          cat my_own_keys.txt >> new_readme.md
          cat alive_keys.txt >> new_readme.md
          mv new_readme.md README.md

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Github Action"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update: Added keys from source"
            git push origin main --force
          fi
          
